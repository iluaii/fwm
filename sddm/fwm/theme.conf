[General]
# Defaults. fwm-sddm-sync writes theme.conf.user next to this file, from the
# wallpaper fwm is showing and the palette matugen takes from it; anything
# there wins over what is here.
#
# wall = an image for every monitor; wall_<W>x<H> = one for a monitor that
# size (SDDM and fwm do not name monitors the same way, but agree on sizes).
wall=
surface=#191206
foreground=#efe0cf
accent=#ffba28
alarm=#ffb4ab
# How solid the islands are — fwm's [decor] tray_opacity.
fill=0.5
